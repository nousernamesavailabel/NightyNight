# NightyNight v2 configuration. Values are parsed as data, not executed as shell code.
PATCH_HOUR=3
PATCH_MINUTE=0
RANDOM_DELAY_MINUTES=30
PERSISTENT_TIMER=true
MIN_FREE_SPACE_MB=2048
MAX_RUNTIME_MINUTES=120
UPDATE_MODE=all
# Space-separated package glob patterns (avoid spaces within patterns).
EXCLUDE_PACKAGES=
EXCLUDE_KERNEL=false
ALLOW_PACKAGE_REMOVALS=false
CHECK_OFFLINE_UPDATES=true
# Never reboot automatically in v2.
AUTO_REBOOT=false
LOG_RETENTION_DAYS=14
NOTIFY_ON_FAILURE=false
NOTIFY_ON_REBOOT=false
# One or more email addresses, separated by commas; requires a functioning local mail command.
NOTIFY_EMAIL=
# ask: prompt interactively, preserve in unattended installs; replace: disable known
# automatic INSTALL timers; preserve: leave native timers unchanged.
# Metadata-refresh timers (apt-daily, dnf-makecache) are never disabled.
NATIVE_UPDATER_POLICY=ask
# Legacy setting retained for migration; use NATIVE_UPDATER_POLICY above.
DISABLE_NATIVE_UPDATERS=false
